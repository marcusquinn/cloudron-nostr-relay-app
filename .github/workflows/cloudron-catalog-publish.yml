name: Publish Cloudron Catalog

# Managed publisher; package checks (including the runtime smoke) gate publication.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudron-catalog-${{ github.event.pull_request.number || 'main' }}
  cancel-in-progress: false

jobs:
  catalog:
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    uses: marcusquinn/aidevops/.github/workflows/cloudron-catalog-publish-reusable.yml@80f3166c4993d9c833ad56f3499bea54cbda9a54
    with:
      aidevops_ref: 80f3166c4993d9c833ad56f3499bea54cbda9a54
      image_repository: ghcr.io/marcusquinn/cloudron-nostr-relay-app
      cli_version: 8.2.6
      cli_integrity: sha512-LHd+4u6pJxDtHX1JuVuWqrUuTbkDu+iH4jjNWW6JgB4+iDLusp08rpt6gifTFPbQjbCZHhnD8LbAGzM1NzDCXw==
      package_checks: |
        bash ./test/package-test.sh
        bash ./test/relay-smoke.sh
        bash ./test/publish-catalog-test.sh
        bash ./test/runtime-smoke.sh --ci
    secrets:
      CLOUDRON_RELEASE_PAT: ${{ secrets.CLOUDRON_RELEASE_PAT }}
