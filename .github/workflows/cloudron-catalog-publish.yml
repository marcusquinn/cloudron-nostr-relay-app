name: Publish Cloudron Catalog

# Pull requests: validate the package and run the container smoke test.
# Pushes to main: when CloudronManifest.json carries a version that is not yet
# in CloudronVersions.json, build and push the image to GHCR, generate the
# catalog entry, commit it, tag vX.Y.Z and create the GitHub release.
# Ported from marcusquinn/cloudron-netbird-app.

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudron-catalog-publish-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_REPOSITORY: ghcr.io/marcusquinn/cloudron-nostr-relay-app
  CLOUDRON_CLI_VERSION: 8.2.6
  CLOUDRON_CLI_INTEGRITY: sha512-LHd+4u6pJxDtHX1JuVuWqrUuTbkDu+iH4jjNWW6JgB4+iDLusp08rpt6gifTFPbQjbCZHhnD8LbAGzM1NzDCXw==
  NAK_VERSION: v0.21.2
  NAK_SHA256: 0acd56fea6ab1b9a0a68c8615670c6f8eff9e8878922442e387b94ee15266bb8

jobs:
  preflight:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
      version: ${{ steps.manifest.outputs.version }}
      upstream_version: ${{ steps.manifest.outputs.upstream_version }}
      before_sha: ${{ steps.manifest.outputs.before_sha }}
      immutable_ref: ${{ steps.existing.outputs.immutable_ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require trusted publication source
        if: github.event_name != 'pull_request'
        env:
          ACTUAL_REF: ${{ github.ref }}
          EXPECTED_REF: refs/heads/main
        run: |
          set -euo pipefail
          test "${ACTUAL_REF}" = "${EXPECTED_REF}"

      - name: Validate package
        run: bash ./test/package-test.sh

      - name: Validate allowlist plugin
        run: bash ./test/relay-smoke.sh

      - name: Validate catalog publisher
        run: bash ./test/publish-catalog-test.sh

      - name: Install pinned Cloudron CLI
        run: |
          registry_integrity="$(npm view "cloudron@${CLOUDRON_CLI_VERSION}" dist.integrity)"
          test "${registry_integrity}" = "${CLOUDRON_CLI_INTEGRITY}"
          npm install --global --ignore-scripts "cloudron@${CLOUDRON_CLI_VERSION}"
          test "$(cloudron --version)" = "${CLOUDRON_CLI_VERSION}"

      - name: Dry-run catalog entry with the real Cloudron CLI
        # The publisher test stubs the CLI. This runs the real manifest,
        # DESCRIPTION.md and CHANGELOG parsing on a scratch copy of the catalog.
        run: |
          set -euo pipefail
          scratch="${RUNNER_TEMP}/catalog-dry-run"
          mkdir -p "${scratch}"
          cp CloudronManifest.json CloudronVersions.json CHANGELOG DESCRIPTION.md logo.png "${scratch}/"
          cd "${scratch}"
          version="$(jq -r '.version' CloudronManifest.json)"
          if jq -e --arg version "${version}" '.versions[$version] != null' CloudronVersions.json >/dev/null; then
            printf 'Version %s is already published; skipping dry run\n' "${version}"
            exit 0
          fi
          cloudron versions add --state testing --image "registry.invalid/dry-run@sha256:$(printf '0%.0s' $(seq 64))"
          cloudron versions verify
          jq -e --arg version "${version}" '.versions[$version].manifest.changelog | length > 0' CloudronVersions.json >/dev/null

      - name: Read manifest metadata
        id: manifest
        run: |
          version="$(jq -r '.version' CloudronManifest.json)"
          upstream_version="$(jq -r '.upstreamVersion' CloudronManifest.json)"
          test -n "${version}" && test "${version}" != "null"
          test -n "${upstream_version}" && test "${upstream_version}" != "null"
          printf 'version=%s\n' "${version}" >> "${GITHUB_OUTPUT}"
          printf 'upstream_version=%s\n' "${upstream_version}" >> "${GITHUB_OUTPUT}"
          printf 'before_sha=%s\n' "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Decide whether this version needs publication
        id: decide
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          if jq -e --arg version "${VERSION}" '.versions[$version] != null' CloudronVersions.json >/dev/null; then
            printf 'publish=false\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'publish=true\n' >> "${GITHUB_OUTPUT}"
          fi

      - name: Validate an existing release entry
        id: existing
        if: steps.decide.outputs.publish == 'false'
        env:
          VERSION: ${{ steps.manifest.outputs.version }}
        run: |
          image_ref="$(jq -r --arg version "${VERSION}" '.versions[$version].manifest.dockerImage' CloudronVersions.json)"
          publish_state="$(jq -r --arg version "${VERSION}" '.versions[$version].publishState' CloudronVersions.json)"
          test "${publish_state}" = "published"
          case "${image_ref}" in
            *@sha256:*) ;;
            *) printf 'Existing release %s is not pinned to an immutable digest\n' "${VERSION}" >&2; exit 1 ;;
          esac
          printf 'immutable_ref=%s\n' "${image_ref}" >> "${GITHUB_OUTPUT}"

  runtime-smoke:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.before_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build candidate image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: nostr-relay-smoke:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install pinned nak client
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset="nak-${NAK_VERSION}-linux-amd64"
          gh release download "${NAK_VERSION}" --repo fiatjaf/nak --pattern "${asset}" --dir "${RUNNER_TEMP}"
          printf '%s  %s\n' "${NAK_SHA256}" "${RUNNER_TEMP}/${asset}" | sha256sum -c -
          install -m 0755 "${RUNNER_TEMP}/${asset}" /usr/local/bin/nak

      - name: Run container smoke test
        run: bash ./test/runtime-smoke.sh nostr-relay-smoke:candidate

  build:
    needs:
      - preflight
      - runtime-smoke
    if: github.event_name != 'pull_request' && needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image_ref: ${{ steps.image.outputs.image_ref }}
    steps:
      - name: Check out the verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.before_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify the build source stayed immutable
        env:
          BEFORE_SHA: ${{ needs.preflight.outputs.before_sha }}
        run: test "$(git rev-parse HEAD)" = "${BEFORE_SHA}"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push amd64 image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_REPOSITORY }}:${{ needs.preflight.outputs.version }}
          cache-from: type=gha

      - name: Record immutable image reference
        id: image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "${DIGEST}"
          printf 'image_ref=%s@%s\n' "${IMAGE_REPOSITORY}" "${DIGEST}" >> "${GITHUB_OUTPUT}"

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_REPOSITORY }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  publish:
    needs:
      - preflight
      - build
    if: github.event_name != 'pull_request' && needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out the verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.before_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the release source stayed immutable
        env:
          BEFORE_SHA: ${{ needs.preflight.outputs.before_sha }}
        run: test "$(git rev-parse HEAD)" = "${BEFORE_SHA}"

      - name: Install pinned Cloudron CLI
        run: |
          registry_integrity="$(npm view "cloudron@${CLOUDRON_CLI_VERSION}" dist.integrity)"
          test "${registry_integrity}" = "${CLOUDRON_CLI_INTEGRITY}"
          npm install --global --ignore-scripts "cloudron@${CLOUDRON_CLI_VERSION}"
          test "$(cloudron --version)" = "${CLOUDRON_CLI_VERSION}"

      - name: Set up Docker Buildx for anonymous verification
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Verify anonymous registry visibility
        env:
          EXPECTED_IMAGE_REF: ${{ needs.build.outputs.image_ref }}
        run: |
          for attempt in $(seq 1 12); do
            if docker buildx imagetools inspect "${EXPECTED_IMAGE_REF}" >/dev/null 2>&1; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          printf 'Timed out waiting for anonymous access to %s; make the GHCR package public\n' "${EXPECTED_IMAGE_REF}" >&2
          exit 1

      - name: Publish and verify catalog entry
        env:
          EXPECTED_IMAGE_REF: ${{ needs.build.outputs.image_ref }}
          EXPECTED_VERSION: ${{ needs.preflight.outputs.version }}
        run: bash scripts/publish-cloudron-catalog.sh CloudronVersions.json "${EXPECTED_IMAGE_REF}" "${EXPECTED_VERSION}"

      - name: Attest catalog provenance
        id: attest-catalog
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: CloudronVersions.json

      - name: Verify catalog provenance
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest-catalog.outputs.bundle-path }}
        run: |
          gh attestation verify CloudronVersions.json \
            --bundle "${BUNDLE_PATH}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/cloudron-catalog-publish.yml" \
            --source-ref refs/heads/main

      - name: Commit generated catalog
        env:
          # CLOUDRON_RELEASE_PAT is needed only if main becomes a protected
          # branch; otherwise the job token can push the catalog commit and tag.
          GH_TOKEN: ${{ secrets.CLOUDRON_RELEASE_PAT || github.token }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          BEFORE_SHA: ${{ needs.preflight.outputs.before_sha }}
        run: |
          git diff --exit-code "${BEFORE_SHA}" -- CloudronManifest.json CHANGELOG CHANGELOG.md
          git add CloudronVersions.json
          test -n "$(git diff --cached --name-only)"
          test "$(git diff --cached --name-only)" = "CloudronVersions.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: publish Cloudron package ${RELEASE_VERSION} [skip ci]"
          git tag -a "v${RELEASE_VERSION}" -m "Release v${RELEASE_VERSION}"
          # aidevops:trust-boundary — expose the repository-scoped credential only after validation.
          gh auth setup-git
          if ! git push --atomic origin HEAD:main "v${RELEASE_VERSION}"; then
            printf '::error::Catalog push for %s was rejected, most likely because main advanced after %s. Nothing was published to the catalog. Rerun this workflow from the current main.\n' "${RELEASE_VERSION}" "${BEFORE_SHA}" >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          UPSTREAM_VERSION: ${{ needs.preflight.outputs.upstream_version }}
        run: |
          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "v${RELEASE_VERSION}" \
            --verify-tag \
            --title "v${RELEASE_VERSION}" \
            --notes "Cloudron package ${RELEASE_VERSION} for strfry ${UPSTREAM_VERSION}."

  verify-existing:
    needs: preflight
    if: needs.preflight.outputs.publish == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Set up Docker Buildx for anonymous verification
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Verify existing immutable image is anonymously pullable
        env:
          IMMUTABLE_REF: ${{ needs.preflight.outputs.immutable_ref }}
        run: docker buildx imagetools inspect "${IMMUTABLE_REF}"

  reconcile-existing-release:
    needs:
      - preflight
      - verify-existing
    if: github.event_name != 'pull_request' && needs.preflight.outputs.publish == 'false'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out published source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.before_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify existing package tag and digest
        env:
          IMMUTABLE_REF: ${{ needs.preflight.outputs.immutable_ref }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          tagged_image_ref="$(
            git show "v${RELEASE_VERSION}:CloudronVersions.json" |
              jq -r --arg version "${RELEASE_VERSION}" '.versions[$version].manifest.dockerImage'
          )"
          test "${tagged_image_ref}" = "${IMMUTABLE_REF}"

      - name: Reconcile GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
          UPSTREAM_VERSION: ${{ needs.preflight.outputs.upstream_version }}
        run: |
          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "v${RELEASE_VERSION}" \
            --verify-tag \
            --title "v${RELEASE_VERSION}" \
            --notes "Cloudron package ${RELEASE_VERSION} for strfry ${UPSTREAM_VERSION}."
